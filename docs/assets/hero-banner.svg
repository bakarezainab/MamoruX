<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B0E"/>
      <stop offset="50%" stop-color="#09191F"/>
      <stop offset="100%" stop-color="#061015"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EC97"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2229" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#081318" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#00EC97" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#00EC97" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="76" x2="1200" y2="76"/>
    <line x1="0" y1="152" x2="1200" y2="152"/>
    <line x1="0" y1="228" x2="1200" y2="228"/>
    <line x1="0" y1="304" x2="1200" y2="304"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="720" y1="0" x2="720" y2="380"/>
    <line x1="960" y1="0" x2="960" y2="380"/>
  </g>

  <!-- Left Shield Emblem -->
  <g transform="translate(65, 58)">
    <polygon points="75,0 150,32 150,105 75,165 0,105 0,32" fill="#081C20" stroke="url(#emeraldGrad)" stroke-width="3" filter="url(#glow)"/>
    <polygon points="75,16 134,42 134,98 75,146 16,98 16,42" fill="#0B272C" stroke="#00EC97" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="75" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#00EC97" text-anchor="middle">守X</text>
    <text x="75" y="122" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">NEAR DARK-POOL</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(250, 72)">
    <rect x="0" y="0" width="355" height="28" rx="14" fill="#00EC97" fill-opacity="0.12" stroke="#00EC97" stroke-opacity="0.5"/>
    <text x="177" y="19" font-family="monospace" font-size="12" font-weight="700" fill="#00EC97" text-anchor="middle">mamoru (守る) = PROTECT • X = CROSS-CHAIN</text>

    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#F8FAFC">Mamoru<tspan fill="url(#emeraldGrad)">X</tspan></text>
    <text x="235" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94A3B8">Confidential AI Dark-Pool &amp; Policy Firewall</text>

    <text x="0" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#CBD5E1">
      Seals cross-chain trade intents with NEP-413 + ChaCha20-Poly1305, nets opposing orders P2P inside
    </text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#CBD5E1">
      NEAR AI Cloud TEEs at 0% slippage, enforces Sentinel AI guardrails, and settles via NEAR Intents &amp; v1.signer.
    </text>
  </g>

  <!-- 4 Bottom Metric Cards -->
  <g transform="translate(55, 255)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="255" height="92" rx="12" fill="url(#cardGrad)" stroke="#00EC97" stroke-opacity="0.4"/>
    <text x="20" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#00EC97">01 • SEALED ORDER SLIPS</text>
    <text x="20" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">0% MEV Leakage</text>
    <text x="20" y="76" font-family="monospace" font-size="11" fill="#94A3B8">NEP-413 + X25519 + ChaCha20</text>

    <!-- Card 2 -->
    <rect x="278" y="0" width="255" height="92" rx="12" fill="url(#cardGrad)" stroke="#00B4D8" stroke-opacity="0.4"/>
    <text x="298" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#00B4D8">02 • NEAR AI CLOUD (TEE)</text>
    <text x="298" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">66.6% CoW Netting</text>
    <text x="298" y="76" font-family="monospace" font-size="11" fill="#94A3B8">deepseek-v3.2 • $0 Pool Fee</text>

    <!-- Card 3 -->
    <rect x="556" y="0" width="255" height="92" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="576" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#F59E0B">03 • SENTINEL AI FIREWALL</text>
    <text x="576" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">3-Agent Quorum</text>
    <text x="576" y="76" font-family="monospace" font-size="11" fill="#94A3B8">Blocks &gt;300bps &amp; Drain Prompts</text>

    <!-- Card 4 -->
    <rect x="834" y="0" width="255" height="92" rx="12" fill="url(#cardGrad)" stroke="#A855F7" stroke-opacity="0.4"/>
    <text x="854" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#C084FC">04 • CHAIN SIGNATURES</text>
    <text x="854" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">4 Native Chains</text>
    <text x="854" y="76" font-family="monospace" font-size="11" fill="#94A3B8">NEAR • ETH • SOL • BTC (v1.signer)</text>
  </g>
</svg>
