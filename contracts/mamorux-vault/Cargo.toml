[package]
name = "mamorux-vault"
version = "0.1.0"
edition = "2021"
description = "MamoruX vault: AI-swarm policy firewall + Chain Signatures executor on NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.4-rust-1.85.0"
image_digest = "sha256:a9d8bee7b134856cc8baa142494a177f2ba9ecfededfcdd38f634e14cca8aae2"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
