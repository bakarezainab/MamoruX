<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <radialGradient id="tee-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00EC97" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#17D9D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip-body" x1="180" y1="100" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2220"/>
      <stop offset="100%" stop-color="#0C0F0E"/>
    </linearGradient>
  </defs>

  <circle cx="280" cy="200" r="185" fill="url(#tee-aura)"/>

  <!-- Circuit Traces -->
  <path d="M80 150 H175 M80 200 H175 M80 250 H175" stroke="#00EC97" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <path d="M385 150 H480 M385 200 H480 M385 250 H480" stroke="#17D9D4" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <path d="M230 45 V95 M280 45 V95 M330 45 V95" stroke="#00EC97" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <path d="M230 305 V355 M280 305 V355 M330 305 V355" stroke="#17D9D4" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>

  <!-- Rotating Outer Security Ring -->
  <circle cx="280" cy="200" r="142" stroke="#00EC97" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="10 10">
    <animateTransform attributeName="transform" type="rotate" from="0 280 200" to="360 280 200" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- TEE Enclave Chip -->
  <rect x="175" y="95" width="210" height="210" rx="28" fill="url(#chip-body)" stroke="#00EC97" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="200" y="120" width="160" height="160" rx="18" fill="#0B0D0C" stroke="#17D9D4" stroke-opacity="0.35" stroke-width="1.4"/>

  <!-- Inner Shield Emblem -->
  <path d="M280 146L320 163V194C320 219 302.5 237 280 245C257.5 237 240 219 240 194V163L280 146Z" fill="#00EC97" fill-opacity="0.12" stroke="#00EC97" stroke-width="2"/>
  <path d="M266 196L276 206L297 183" stroke="#00EC97" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
